# =============================================================================
# Taranac — HA (Pro) overlay (docs/ops/ha.md).
#
# Converts the standalone DB layer to a self-managing Patroni + etcd cluster. Apply
# it ON TOP of the base compose, on EVERY DB node (each node runs the full stack):
#
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.ha.yml up -d
#
# The WITNESS host runs only docker-compose.witness.yml (a 3rd etcd voting member in
# a SEPARATE failure domain — MANDATORY for a 2-node cluster, ha.md §8).
#
# What it changes:
#   • `postgres` → the taranac-postgres-ha image (Patroni-supervised Postgres 16).
#     It ADOPTS an existing standalone PGDATA in place (no re-init) or initdb's a
#     fresh node. Same service NAME so every `@postgres` DSN stays node-local.
#   • adds a co-located `etcd` member (the DCS), and the `etcd-agent` that renews
#     this member's etcd client-TLS certificate before it expires.
#   • publishes 5432/8008 (Postgres + Patroni REST) and 2379/2380 (etcd) so the
#     OTHER node + the witness can reach this one.
#
# The api + daemons need NO change here: they already read DB_HOSTS from .env
# (writes route to the current primary) and connect to the node-local `@postgres`
# for reads (§2/§3). Set DB_HOSTS + the HA block in .env.
#
# ⚠️ SECURITY: both etcd ports (2379 client + 2380 peer) carry cluster control state, so
# they MUST be firewalled to the cluster's PRIVATE interconnect and never exposed publicly
# — TLS is not a substitute for the firewall.
#
# Secure etcd (peer auto-TLS + one-way client TLS) is the DEFAULT (#30): ha-convert
# --prepare/--continue writes ETCD_PEER_SCHEME=https + ETCD_PEER_AUTO_TLS=true and the
# client-TLS knobs into .env and rewrites the member URLs to https://. The compose
# ${VAR:-http}/${VAR:-false} FALLBACKS below are NOT the product default — they are the
# inert value for an un-provisioned / hand-rolled .env or a deliberate `ha-convert
# --plaintext` opt-out. The scheme here always tracks .env.
#
# Peer TLS (ha.md §7.2): auto-TLS = self-signed, zero cert management, encryption-only
# (NOT mutual auth). etcd requires the peer transport CONSISTENT across the whole ring, so
# a blind full `up -d` that flips the peer scheme under a LIVE cluster breaks the Raft ring
# — migrate a running cluster only via the §7.2 runbook, never by editing + `up -d`.
#
# CLIENT TLS (ha.md §7.3): the client channel (2379, Patroni↔etcd + every etcdctl) needs a
# shared, out-of-band-provisioned CA (Patroni's etcd client cannot skip-verify) — ha-convert
# /ha-join generate + distribute it as part of the unified "cluster secret set" (ha.md §12)
# into ./config/etcd-tls, RO-mounted below. It is ONE-WAY (server-only): etcd presents a
# CA-signed cert (SAN = this node's NODE_ADDRESS + 127.0.0.1); clients verify it and present
# NO client cert (ETCD_CLIENT_CERT_AUTH=false). Empty cert paths ⇒ etcd serves plaintext http
# ⇒ byte-identical to the plaintext opt-out. Migrating a LIVE cluster http→https client is a
# deliberate rolling procedure — see the runbook in ha.md §7.3, never a blind `up -d`.
# =============================================================================
services:
  # ── etcd — the DCS (one voting member per DB node; the witness adds the 3rd) ──
  etcd:
    container_name: taranac-etcd
    # Off IPv6 like every non-client service of the base file (its x-ipv4-only;
    # an anchor does not reach across compose files). postgres keeps the base's.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    image: quay.io/coreos/etcd:v3.5.17@sha256:a055da833a7c013b836ed0822e8ec1f99b059658be255ad8d0fcd31b635ae3d6
    # etcd reads ETCD_* env natively. ETCD_NAME + the full ETCD_INITIAL_CLUSTER
    # member list come from .env (identical list on every member; each node sets
    # its own ETCD_NAME). A 2-node cluster MUST list the 3rd witness member.
    environment:
      ETCD_NAME: ${ETCD_NAME}
      ETCD_DATA_DIR: /etcd-data
      # Peer (Raft) scheme + auto-TLS — https by the secure default (#30), written into
      # .env by ha-convert (the ${VAR:-…} fallback here is only for a plaintext/hand-rolled
      # .env). Encrypts the cross-host interconnect (self-signed, no CA). The scheme here
      # MUST match the scheme in ETCD_INITIAL_CLUSTER's member URLs.
      ETCD_LISTEN_PEER_URLS: ${ETCD_PEER_SCHEME:-http}://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: ${ETCD_PEER_SCHEME:-http}://${NODE_ADDRESS}:2380
      ETCD_PEER_AUTO_TLS: "${ETCD_PEER_AUTO_TLS:-false}"
      # Client (Patroni↔etcd) scheme — https by the secure default (#30); the tooling writes
      # ETCD_CLIENT_SCHEME=https + the cert paths below (into the ./config/etcd-tls RO mount).
      # Empty cert paths / the ${VAR:-http} fallback ⇒ etcd serves plaintext http ⇒
      # byte-identical to the --plaintext opt-out. One-way: no trusted-ca, cert-auth off.
      ETCD_LISTEN_CLIENT_URLS: ${ETCD_CLIENT_SCHEME:-http}://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: ${ETCD_CLIENT_SCHEME:-http}://${NODE_ADDRESS}:2379
      ETCD_CERT_FILE: ${ETCD_SERVER_CERT_FILE:-}
      ETCD_KEY_FILE: ${ETCD_SERVER_KEY_FILE:-}
      ETCD_CLIENT_CERT_AUTH: "${ETCD_CLIENT_CERT_AUTH:-false}"
      ETCD_INITIAL_CLUSTER: ${ETCD_INITIAL_CLUSTER}
      ETCD_INITIAL_CLUSTER_STATE: ${ETCD_INITIAL_CLUSTER_STATE:-new}
      # The ring's IDENTITY — deliberately not its name.
      #
      # etcd derives a cluster's ClusterID from this token plus the initial member
      # set. With the token set to TARANAC_CLUSTER_NAME, a cluster torn down and
      # built again under the same name with the same first members came back with
      # a byte-identical ClusterID — so a machine left over from the old cluster,
      # or from a join that never finished, was not a stranger to the new ring. It
      # was the same cluster as far as etcd could tell, and it reattached without a
      # word. That is how a member of a week-old failed join turned up in a
      # rebuilt cluster in the field.
      #
      # TARANAC_CLUSTER_ID is drawn once per INCARNATION of a cluster: `cluster
      # init` / `ha-convert --prepare` generate it when absent, ha-deconvert clears
      # it, and every joining node and the witness receive it over the join channel.
      # Rebuilding therefore produces a genuinely different cluster, and a leftover
      # member is refused instead of welcomed.
      #
      # The fallback keeps every cluster built before this key existed exactly as it
      # is: no value ⇒ the old token ⇒ the same ClusterID ⇒ nothing to migrate.
      ETCD_INITIAL_CLUSTER_TOKEN: ${TARANAC_CLUSTER_ID:-${TARANAC_CLUSTER_NAME}}
      # The healthcheck's etcdctl is itself a client — under client-TLS it MUST get the
      # https endpoint + CA or the probe fails and `postgres` (depends_on: service_healthy)
      # never starts, wedging the node with no obvious cause (ha.md §7.3 footgun). Empty
      # CACERT + http endpoint ⇒ identical to the plaintext default.
      # ── Compaction — WITHOUT this etcd keeps every revision FOREVER ─────────
      # Patroni rewrites the leader key every ~10s, so the DCS backend grows by
      # roughly 13 MB/day in a cluster that is otherwise idle. Nothing reads that
      # history; it simply accumulates until fsync latency starts costing leader
      # elections, at which point the primary begins demoting itself with "DCS is
      # not accessible" and re-promoting seconds later. Measured on a customer's
      # cluster at 127 MB / raft term 6641 / Postgres timeline 218 — and on our own
      # lab, two days after a clean rebuild, already at 27 MB. This is universal,
      # not a symptom of scale, and it is why the default is not good enough.
      #
      # `revision` rather than `periodic`: the write rate of a Patroni DCS is
      # constant and known, so a revision count is a bound that does not drift with
      # load. Measured on the lab at ~25 revisions/minute, so 1000 is on the order of
      # half an hour of history — far more than anything reads, and it keeps the
      # backend in the tens of kB instead of tens of MB.
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCDCTL_ENDPOINTS: ${ETCD_CLIENT_SCHEME:-http}://127.0.0.1:2379
      ETCDCTL_CACERT: ${ETCD_CLIENT_CACERT:-}
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd_data:/etcd-data
      # Client-TLS material (ca.crt + this node's etcd-server.crt/.key), laid down OOB
      # by ha-convert/ha-join. Empty/inert when client-TLS is OFF.
      - ./config/etcd-tls:/etc/etcd/tls:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── postgres → Patroni-supervised Postgres 16 (same service name) ──────────
  postgres:
    image: ${IMAGE_PREFIX}/postgres-ha:${TARANAC_VERSION}
    # Drop the standalone `postgres -c …` command — Patroni owns the conf (it carries
    # the identical §6.7 baseline in its bootstrap config). The image's entrypoint
    # renders the Patroni config from the env below and execs Patroni.
    command: []
    environment:
      # Per-node identity + DCS wiring (envsubst'd into the Patroni config).
      PATRONI_NAME: ${TARANAC_NODE_NAME}
      PATRONI_SCOPE: ${TARANAC_CLUSTER_NAME}
      NODE_ADDRESS: ${NODE_ADDRESS}
      ETCD_HOSTS: ${ETCD_HOSTS}
      # etcd CLIENT-TLS (one-way): default http ⇒ Patroni's etcd3 block stays scheme-less
      # ⇒ byte-identical. When enabled, the entrypoint injects `protocol: https` + `cacert`
      # (the CA in the ./config/etcd-tls RO mount below) so Patroni verifies the etcd cert.
      ETCD_CLIENT_SCHEME: ${ETCD_CLIENT_SCHEME:-http}
      ETCD_CLIENT_CACERT: ${ETCD_CLIENT_CACERT:-}
      # The app role IS the Postgres superuser (matches the standalone image) — one
      # password, the same the app connects with. This is what lets Patroni adopt an
      # existing standalone PGDATA in place (that role is its only superuser).
      PGPW: ${POSTGRES_PASSWORD}
      # The replicator role password (== the standalone POSTGRES_REPLICATION_PASSWORD).
      REPLPW: ${POSTGRES_REPLICATION_PASSWORD}
      # pg_hba TCP scope — NARROW to the cluster's private subnet (default: broad).
      PG_ALLOW_CIDR: ${PG_ALLOW_CIDR:-0.0.0.0/0}
      # Patroni REST auth — CLUSTER-WIDE and MANDATORY. NOTE the deliberate absence of a
      # ${VAR:-default} fallback here: the port below is published to the host and serves
      # /switchover, /failover, /restart and /reload, so an unset password must stop the
      # node (the entrypoint refuses to start and prints the remedy), never quietly bring
      # up an open control plane. install.sh generates it; ha-join.sh adopts the cluster's.
      # The api container reads the SAME two vars straight from .env (env_file) to talk to
      # this listener — one value, no per-node drift.
      PATRONI_REST_USERNAME: ${PATRONI_REST_USERNAME:-patroni}
      PATRONI_REST_PASSWORD: ${PATRONI_REST_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # the other node + its daemons reach this DB
      - "8008:8008"                      # Patroni REST (patronictl / the slot reaper) — auth'd on writes
    volumes:
      # etcd client-TLS CA (read by Patroni + the entrypoint DCS probe when https).
      # Inert when client-TLS is OFF. Same source dir as the etcd member above.
      - ./config/etcd-tls:/etc/etcd/tls:ro
    depends_on:
      etcd:
        condition: service_healthy
    # Patroni manages Postgres; pg_isready confirms it is accepting connections.
    # Generous start_period covers initdb/adoption + bootstrap on a fresh node.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taranac"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  # ── etcd-agent — keeps THIS member's etcd client-TLS leaf from expiring ────
  # Renews config/etcd-tls/etcd-server.crt 45 days before its end with the cluster CA
  # key on this node's disk (same key, same SANs, one atomic rename — etcd reloads
  # it on the next handshake, nothing restarts), answers `./taranac cluster
  # renew-cert --all`, and hands the CA key — encrypted to the member's own leaf —
  # to a member that has none (a witness after the update that brought this).
  # The same container runs on the witness (docker-compose.witness.yml).
  #
  # What it is NOT given, on purpose: the Docker socket (it has nothing to restart,
  # and without the socket "it restarted Postgres" is impossible, not just unintended)
  # and the host .env (MASTER_KEY, SECRET_KEY, the database passwords) — only the four
  # values below. It runs as root solely so a replaced file keeps its owner, group and
  # mode (group 999 on config/etcd-ca, or the backup stops carrying the CA); every
  # other capability is dropped and the root filesystem is read-only.
  # network_mode host: it talks to this node's etcd on 127.0.0.1:2379 (a SAN of every
  # leaf) and reads the leaf other members serve at their own addresses.
  etcd-agent:
    container_name: taranac-etcd-agent
    image: ${IMAGE_PREFIX}/etcd-agent:${TARANAC_VERSION}
    network_mode: host
    environment:
      ETCD_NAME: ${ETCD_NAME}
      ETCD_CLIENT_SCHEME: ${ETCD_CLIENT_SCHEME:-http}
      TARANAC_VERSION: ${TARANAC_VERSION}
      ETCD_AGENT_KIND: db
    volumes:
      - ./config/etcd-ca:/cfg/etcd-ca
      - ./config/etcd-tls:/cfg/etcd-tls
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    depends_on:
      etcd:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }

  # ── taranac-mfa — HA write-routing (ha.md §3 / §12) ────────────────────────
  # The base compose points mfa at the node-local `@postgres`. Its DB
  # (taranac_mfa) replicates with the cluster, so verify (read) works on any node,
  # but enroll (write) on a replica hits a read-only DB and fails. Hand mfa the
  # SAME cluster-wide DB_HOSTS the api uses: psycopg2/libpq then routes writes to
  # the current primary via target_session_attrs=read-write, and boot migrations
  # become leader-gated. Empty DB_HOSTS (standalone / DMZ) ⇒ no routing, byte-
  # identical to the base compose. ha-convert/ha-join set DB_HOSTS in .env.
  taranac-mfa:
    environment:
      TARANAC_MFA_DB_HOSTS: ${DB_HOSTS}
      # This node's own member is dialled at @postgres, not by its LAN address (a
      # hairpin a LAN-only host firewall drops); each member gets its own timeout.
      # Explicit: mfa deliberately has no env_file.
      TARANAC_MFA_NODE_ADDRESS: ${NODE_ADDRESS}
      TARANAC_MFA_DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-3}

volumes:
  etcd_data: {}
