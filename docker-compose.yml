# =============================================================================
# Taranac — distribution compose (pulls published images; no source needed)
#
#   docker compose --env-file .env -f docker-compose.yml pull
#   docker compose --env-file .env -f docker-compose.yml up -d
#
# Use ./install.sh for first-time setup (it generates secrets + writes .env).
# Images come from ${IMAGE_PREFIX}/<service>:${TARANAC_VERSION}.
# =============================================================================
name: taranac

# IPv6 on the stack network is for the services a client dials from outside:
# edge, taranac-mfa, tacacs, radius, nac, est-gateway, captive-portal — they see
# an IPv6 client's own address, not the gateway's. Every other container is kept
# off IPv6 with this sysctl: it gets no IPv6 address and no AAAA record, so a
# name inside the stack (api, postgres, …) always resolves to IPv4 alone — glibc
# would otherwise dial AAAA first. A new service on this network picks one of
# the two (deploy/dist/tests/test_ipv6_exposure.sh holds the list).
x-ipv4-only: &ipv4-only
  net.ipv6.conf.all.disable_ipv6: "1"

services:
  # ── Edge reverse proxy — the PUBLIC TLS the browser/phone sees ──────
  edge:
    container_name: taranac-edge
    networks:
      default:
        ipv4_address: 10.255.255.226
    image: ${IMAGE_PREFIX}/edge:${TARANAC_VERSION}
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    environment:
      TARANAC_DOMAIN: ${TARANAC_DOMAIN}
      # Any further addresses this node answers on (names and IPs, comma or
      # space separated). They widen the self-signed certificate's SAN and
      # nginx's server_name — staff open a name while a remote collector
      # dials the IP, and both must work without picking a winner.
      TARANAC_EXTRA_ADDRESSES: ${TARANAC_EXTRA_ADDRESSES:-}
      TARANAC_MFA_DOMAIN: ${TARANAC_MFA_DOMAIN:-}
      TARANAC_TLS_CERT: ${TARANAC_TLS_CERT:-/etc/taranac/tls/tls.crt}
      TARANAC_TLS_KEY: ${TARANAC_TLS_KEY:-/etc/taranac/tls/tls.key}
    volumes:
      # The self-signed fallback certificate lives in a VOLUME, not the container's
      # writable layer. Otherwise every restart or recreate of this container mints
      # a NEW certificate — and every standalone collector and captive portal that
      # pinned the old one refuses to talk until an operator re-pins it by hand, on
      # each remote box. A routine `restart edge` must not cost that.
      - taranac_edge_tls:/etc/taranac/tls-selfsigned
      - /etc/localtime:/etc/localtime:ro
      # Operator-supplied public certificate (tls.crt + tls.key). Optional —
      # the edge self-signs if absent.
      - ./config/tls:/etc/taranac/tls:ro
      # Internal CA, to verify the taranac-mfa upstream when fronted.
      - taranac_certs:/opt/taranac/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend — Metronic 8 React (internal; fronted by edge) ─────────
  frontend:
    container_name: taranac-frontend
    sysctls: *ipv4-only
    networks:
      default:
        ipv4_address: 10.255.255.227
    image: ${IMAGE_PREFIX}/frontend:${TARANAC_VERSION}
    volumes:
      - taranac_certs:/opt/taranac/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost — nginx listens on IPv4 only; localhost resolves
      # to ::1 first inside the container and the check would falsely fail.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Backend API — FastAPI (HTTPS) ───────────────────────────────────
  api:
    container_name: taranac-api
    sysctls: *ipv4-only
    image: ${IMAGE_PREFIX}/api:${TARANAC_VERSION}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://taranac:${POSTGRES_PASSWORD}@postgres:5432/taranac
      MONITORING_HOST_ROOT: /host
      SUPPORTED_LOCALES: "${SUPPORTED_LOCALES:-en,de,es,fr,pt}"
      # The TACACS+ listener ports the config generator renders and the UI shows —
      # interpolated once here so api, tacacs and the published ports share one
      # value and one default.
      TACACS_PORT: "${TACACS_PORT:-49}"
      TACACS_TLS_PORT: "${TACACS_TLS_PORT:-6049}"
      # Same for RADIUS (aaa) and NAC: the listeners the api renders and the UI shows.
      RADIUS_AUTH_PORT: "${RADIUS_AUTH_PORT:-1812}"
      RADIUS_ACCT_PORT: "${RADIUS_ACCT_PORT:-1813}"
      NAC_AUTH_PORT: "${NAC_AUTH_PORT:-1814}"
      NAC_ACCT_PORT: "${NAC_ACCT_PORT:-1815}"
      # The EST host ports PKI Settings shows: password enrollment through the
      # edge proxy, re-enrollment with the client certificate on the est-gateway —
      # the same interpolations those services publish.
      EDGE_HTTPS_PORT: "${EDGE_HTTPS_PORT:-443}"
      EST_GATEWAY_PORT: "${EST_GATEWAY_PORT:-8445}"
      # Plain-HTTP SCEP (SCEP paths only — EST stays HTTPS): Cisco IOS and MikroTik
      # SCEP clients cannot do HTTPS. The api shows it in the SCEP device URL.
      SCEP_HTTP_PORT: "${SCEP_HTTP_PORT:-8446}"
      # Reports PDF renderer (taranac-renderer) — internal HTTPS, verified against
      # the internal CA. The shared API key comes from .env (env_file above);
      # the :-changeme fallback keeps api↔renderer matched if the key is unset.
      REPORTS_RENDERER_URL: https://taranac-renderer:8443
      REPORTS_RENDERER_CA_CERT: /opt/taranac/certs/ca.crt
      REPORTS_RENDERER_API_KEY: ${REPORTS_RENDERER_API_KEY:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /:/host:ro
      - app_logs:/app/logs
      - aaa_logs:/app/logs/aaa
      # RW: the API downloads live logs and prunes/deletes forensic month-dirs
      # (System → Log Rotation). Live-log trimming stays daemon-side.
      - tacacs_logs:/app/logs/tacacs
      - radius_logs:/app/logs/radius
      - nac_logs:/app/logs/nac
      # Daemon config dirs (shared with the daemons): the api generates their
      # configs here and runs the file-based health handshake (.health_signal /
      # .health_result.json). Without these the UI shows the daemons unavailable.
      - tacacs_config:/etc/tac_plus
      - radius_config:/mnt/radius_config
      - nac_config:/mnt/nac_config
      - captive_portal_config:/mnt/captive_portal_config
      # Domain membership (MS-CHAPv2): the api generates the winbind sidecar's
      # smb.conf/krb5.conf like every other daemon config, and hands join
      # requests over the runtime volume — a file it writes 0600 and the sidecar
      # deletes the moment it reads it, which an HTTP body could not be.
      - winbind_config:/mnt/winbind_config
      - winbind_runtime:/mnt/winbind_runtime
      - taranac_certs:/opt/taranac/certs
      - vendor_dictionaries:/opt/taranac/vendor_dictionaries
      # System backups (System → Backup). MUST be a named volume — otherwise the
      # archives live only on the container's writable layer and are wiped when
      # an update recreates the api container.
      - backups:/app/backups
      # Host-side files the archive carries so a disaster is recoverable (System →
      # Backup). READ-ONLY: the api reads them, never writes them.
      #   env      — the five values that must survive a rebuild live only here
      #              (MASTER_KEY, SECRET_KEY, TARANAC_MFA_API_KEY, INTERNAL_API_KEY,
      #              REPORTS_RENDERER_API_KEY). Restore takes those five and leaves
      #              this node's own topology alone — it never copies the file back.
      #   compose  — how this install was wired, for the operator to read.
      #   config   — the operator's own TLS certificate, the Firebase key, and the
      #              cluster's etcd CA. An allowlist of three subdirectories: tls,
      #              firebase and etcd-ca. cluster-secrets/ stays out — the join
      #              re-delivers it — while the etcd CA is IN deliberately (HA.md
      #              §4.2): it is the key that admits a new node, and keeping it on
      #              one disk put a single point of failure inside the feature that
      #              exists to survive one. Each is read only if its group allows
      #              uid 999; anything unreadable is named in the backup's report.
      - ./.env:/app/host/env:ro
      - ./docker-compose.yml:/app/host/compose.yml:ro
      - ./config:/app/host/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "--cacert", "/opt/taranac/certs/ca.crt", "https://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Failures inside start_period do not count, and the first passing check
      # ends it, so a long one costs a normal boot nothing. It is what a first
      # boot needs: migrations on an empty database, or a replica waiting for the
      # schema to stream in. At 30s every service depending on api gave up on a
      # fresh install whose api was merely still starting.
      start_period: 300s
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "10" }

  # ── Taranac MFA — Push/TOTP (HTTPS) ─────────────────────────────────
  taranac-mfa:
    container_name: taranac-mfa
    image: ${IMAGE_PREFIX}/mfa:${TARANAC_VERSION}
    ports: ["${MFA_PORT:-8443}:8443"]
    environment:
      # Generated by install.sh, backfilled by the update reconciler
      # (env-secrets.sh). Empty or shorter than 32 characters ⇒ the service
      # refuses to start and says so — never an open token API.
      TARANAC_MFA_API_KEY: ${TARANAC_MFA_API_KEY}
      TARANAC_MFA_DATABASE_URL: postgresql://taranac:${POSTGRES_PASSWORD}@postgres:5432/taranac_mfa
      TARANAC_MFA_SECRET_KEY_FILE: /opt/taranac/data/enckey
      # HA (Pro): the seed's shared mfa key (base64), provisioned by ha-convert/ha-join so
      # Push tokens decrypt on every node (ha.md §12). Absent-only ⇒ the entrypoint honours
      # an existing file and self-generates on a fresh standalone/DMZ node. Empty by default
      # (single node / DMZ-standalone) ⇒ byte-identical to before.
      TARANAC_MFA_ENCKEY: "${TARANAC_MFA_ENCKEY:-}"
      TARANAC_MFA_FIREBASE_JSON: /opt/taranac/firebase/firebase-credentials.json
      TARANAC_MFA_LOG_LEVEL: INFO
      TARANAC_MFA_LOG_FORMAT: json
      TARANAC_MFA_CORS_ORIGINS: ""
      # The only proxy in front of this service is the edge, and only for phones
      # that use TARANAC_MFA_DOMAIN. 8443 is also published directly, so
      # X-Forwarded-For is believed from the edge container alone — a direct
      # caller is its own client, whatever header it sends (re-resolved by name,
      # so an edge recreate is followed).
      TARANAC_MFA_TRUSTED_PROXIES: edge
      TARANAC_MFA_PUSH_REGISTRATION_URL: ${TARANAC_MFA_PUSH_REGISTRATION_URL}
      TARANAC_MFA_TLS_CERT: /opt/taranac/certs/mfa/server.crt
      TARANAC_MFA_TLS_KEY: /opt/taranac/certs/mfa/server.key
      INTERNAL_TLS_VERIFY: "${INTERNAL_TLS_VERIFY:-true}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - mfa_data:/opt/taranac/data
      # Optional Firebase service-account key (paid push tier). Without it,
      # MFA runs in free poll-only mode.
      - ./config/firebase:/opt/taranac/firebase:ro
      - taranac_certs:/opt/taranac/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sfk", "https://localhost:8443/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "10" }

  # ── TACACS+ — tac_plus-ng ───────────────────────────────────────────
  tacacs:
    container_name: taranac-tacacs
    networks:
      default:
        ipv4_address: 10.255.255.232
    image: ${IMAGE_PREFIX}/tacacs:${TARANAC_VERSION}
    ports:
      # One number end to end: the same TACACS_PORT / TACACS_TLS_PORT is the
      # host port, the port the daemon binds (the api renders it into the config)
      # and the port the UI shows. Changing it: edit the env, then `up -d`.
      - "${TACACS_PORT:-49}:${TACACS_PORT:-49}"
      - "${TACACS_TLS_PORT:-6049}:${TACACS_TLS_PORT:-6049}"
    env_file: .env
    environment:
      TACACS_DB_URL: "postgresql://taranac:${POSTGRES_PASSWORD}@postgres:5432/taranac"
      # Same value the api renders as the listener: the health check probes it.
      TACACS_PORT: "${TACACS_PORT:-49}"
      TACACS_TLS_PORT: "${TACACS_TLS_PORT:-6049}"
      TACACS_MASTER_KEY_FILE: "/run/secrets/master_key"
      MASTER_KEY: "${MASTER_KEY:-}"
      INTERNAL_TLS_VERIFY: "${INTERNAL_TLS_VERIFY:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - tacacs_config:/etc/tac_plus
      - tacacs_logs:/var/log/taranac
      - master_key:/run/secrets
      - taranac_certs:/opt/taranac/certs:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "10" }

  # ── RADIUS — FreeRADIUS 3.2 + rlm_python3 ───────────────────────────
  radius:
    container_name: taranac-radius
    networks:
      default:
        ipv4_address: 10.255.255.233
    image: ${IMAGE_PREFIX}/radius:${TARANAC_VERSION}
    ports:
      # One number end to end: the same port is published on the host, bound by
      # radiusd (the api renders it into the config) and shown in the UI.
      # Changing it: edit the env, then `up -d`.
      - "${RADIUS_AUTH_PORT:-1812}:${RADIUS_AUTH_PORT:-1812}/udp"
      - "${RADIUS_ACCT_PORT:-1813}:${RADIUS_ACCT_PORT:-1813}/udp"
    env_file: .env
    environment:
      RADIUS_DB_URL: "postgresql://taranac:${POSTGRES_PASSWORD}@postgres:5432/taranac"
      # Same value the api renders as the listener: the entrypoint moves a config
      # still on other ports (the bootstrap, an earlier release's) onto it.
      RADIUS_AUTH_PORT: "${RADIUS_AUTH_PORT:-1812}"
      RADIUS_ACCT_PORT: "${RADIUS_ACCT_PORT:-1813}"
      RADIUS_MASTER_KEY_FILE: "/run/secrets/master_key"
      # Samba tools honour SMB_CONF_PATH, so ntlm_auth's client config arrives in
      # this daemon's existing config volume — no extra mount, same delivery
      # mechanism as every other generated file.
      SMB_CONF_PATH: "/etc/raddb/smb.conf"
      MASTER_KEY: "${MASTER_KEY:-}"
      LOG_LEVEL: "INFO"
      CONFIG_WAIT_TIMEOUT: "120"
      INTERNAL_TLS_VERIFY: "${INTERNAL_TLS_VERIFY:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - radius_config:/etc/raddb
      # winbindd's sockets. Without the PRIVILEGED one ntlm_auth authenticates
      # but withholds NT_KEY, and every domain login fails with a CORRECT
      # password; the public pipe is needed to reach winbind at all.
      - winbind_socket:/var/lib/samba/winbindd_privileged:ro
      - winbind_run:/var/run/samba/winbindd:ro
      - radius_logs:/var/log/taranac
      - master_key:/run/secrets
      - taranac_certs:/opt/taranac/certs:ro
    restart: unless-stopped
    # The radiusd supervisor stops in up to 10 s (TERM to every radiusd, then KILL).
    stop_grace_period: 15s
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "10" }

  # ── NAC — FreeRADIUS 3.2 (802.1X) ───────────────────────────────────
  nac:
    container_name: taranac-nac
    networks:
      default:
        ipv4_address: 10.255.255.234
    image: ${IMAGE_PREFIX}/nac:${TARANAC_VERSION}
    ports:
      # One number end to end: the same port is published on the host, bound by
      # the NAC radiusd (the api renders it into the config) and shown in the UI.
      # Changing it: edit the env, then `up -d`.
      - "${NAC_AUTH_PORT:-1814}:${NAC_AUTH_PORT:-1814}/udp"
      - "${NAC_ACCT_PORT:-1815}:${NAC_ACCT_PORT:-1815}/udp"
    env_file: .env
    environment:
      NAC_DB_URL: "postgresql://taranac:${POSTGRES_PASSWORD}@postgres:5432/taranac"
      # Same value the api renders as the listener: the entrypoint moves a config
      # still on other ports (the bootstrap, an earlier release's) onto it.
      NAC_AUTH_PORT: "${NAC_AUTH_PORT:-1814}"
      NAC_ACCT_PORT: "${NAC_ACCT_PORT:-1815}"
      NAC_MASTER_KEY_FILE: "/run/secrets/master_key"
      # Samba tools honour SMB_CONF_PATH, so ntlm_auth's client config arrives in
      # this daemon's existing config volume — no extra mount, same delivery
      # mechanism as every other generated file.
      SMB_CONF_PATH: "/etc/raddb/smb.conf"
      MASTER_KEY: "${MASTER_KEY:-}"
      LOG_LEVEL: "INFO"
      CONFIG_WAIT_TIMEOUT: "120"
      INTERNAL_TLS_VERIFY: "${INTERNAL_TLS_VERIFY:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - nac_config:/etc/raddb
      # winbindd's sockets. Without the PRIVILEGED one ntlm_auth authenticates
      # but withholds NT_KEY, and every domain login fails with a CORRECT
      # password; the public pipe is needed to reach winbind at all.
      - winbind_socket:/var/lib/samba/winbindd_privileged:ro
      - winbind_run:/var/run/samba/winbindd:ro
      # NO separate volume over certs/nac — it must stay part of nac_config.
      # The api writes the operator's server certificate to
      # /mnt/nac_config/certs/nac/ (its own view of THIS volume); a second
      # volume mounted on top of that subdirectory made the written files
      # invisible to FreeRADIUS, so a custom certificate never took effect.
      - nac_logs:/var/log/taranac
      - master_key:/run/secrets
      - vendor_dictionaries:/opt/nac_module/vendor_dictionaries:ro
      - taranac_certs:/opt/taranac/certs:ro
    # The FreeRADIUS fork bounds an OCSP check to ~3 s, but not the name lookup
    # before it: with musl's defaults a dead resolver costs 5 s per lookup, so
    # one check took 5.4 s, past a NAS's RADIUS timeout. Two seconds in all, the
    # query resent after one: a dead resolver fails in 2 s, and a resolver that
    # answers in 1.5 s still resolves (1/1 failed it — and every lookup here, the
    # LDAP servers' included, goes through this). Measured in the nac image.
    dns_opt:
      - timeout:2
      - attempts:2
    restart: unless-stopped
    # The radiusd supervisor stops in up to 10 s (TERM to every radiusd, then KILL).
    stop_grace_period: 15s
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "10" }

  # ── EST gateway — mutual TLS for RFC 7030 re-enrollment ─────────────
  # Its own listener because EST verifies CLIENT certificates against the NAC
  # internal CAs — a trust anchor the edge must never use, or every browser would
  # be asked for a certificate. Basic enrollment works through it too (and through
  # the edge, 443); re-enrollment (/simplereenroll) works ONLY here: the edge path
  # blanks the client-certificate headers on purpose. Runs always — with EST off
  # the api simply refuses what it forwards.
  est-gateway:
    container_name: taranac-est-gateway
    networks:
      default:
        ipv4_address: 10.255.255.228
    image: ${IMAGE_PREFIX}/est-gateway:${TARANAC_VERSION}
    # 8445: taranac-mfa holds 8443 and the captive portal 8444 on this host, and
    # the HA join broker (cluster add-node / add-witness) listens on 9443.
    # 8446: plain-HTTP SCEP, the next free port after the gateway's own 8445.
    ports: ["${EST_GATEWAY_PORT:-8445}:8443", "${SCEP_HTTP_PORT:-8446}:8080"]
    environment:
      EST_GATEWAY_PORT: "8443"
      # Proves to the api that the client-certificate headers are this gateway's.
      # The api reads the same key from .env (env_file); install.sh generates it
      # and `./taranac update` backfills it (env-secrets.sh) — no operator step.
      EST_PROXY_KEY: "${EST_PROXY_KEY:-}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # The api writes the client trust here (certs/est/ca_bundle.pem + ca_chain.pem);
      # until it exists the gateway trusts nobody for mTLS.
      - nac_config:/mnt/nac_config
      # Its own server certificate, est-gateway/server.{crt,key} — never the NAC
      # (EAP) one. Until it exists the gateway starts with a temporary identity.
      - taranac_certs:/opt/taranac/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "10" }

  # ── Captive Portal — nginx (embedded) ───────────────────────────────
  captive-portal:
    container_name: taranac-captive-portal
    networks:
      default:
        ipv4_address: 10.255.255.229
    image: ${IMAGE_PREFIX}/captive-portal:${TARANAC_VERSION}
    ports:
      - "${CAPTIVE_PORTAL_HTTP_PORT:-8080}:80"
      - "${CAPTIVE_PORTAL_HTTPS_PORT:-8444}:443"
    environment:
      INTERNAL_TLS_VERIFY: "${INTERNAL_TLS_VERIFY:-true}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - captive_portal_config:/etc/nginx/portal.d
      - portal_instance_data:/app/data
      - taranac_certs:/opt/taranac/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "10" }

  # ── Taranac Renderer — HTML→PDF for report exports (internal HTTPS) ──
  # Backend-only client (the api), no published port. Serves TLS from the shared
  # internal CA; the api mints renderer/server.{crt,key} into taranac_certs on
  # first run and backfills it on upgrade (generate-certs.sh is idempotent).
  taranac-renderer:
    container_name: taranac-renderer
    sysctls: *ipv4-only
    networks:
      default:
        ipv4_address: 10.255.255.230
    image: ${IMAGE_PREFIX}/renderer:${TARANAC_VERSION}
    environment:
      # Shared api↔renderer auth key, interpolated from .env; :-changeme keeps the
      # two matched if the key is unset (only its own var is exposed — no env_file).
      REPORTS_RENDERER_API_KEY: ${REPORTS_RENDERER_API_KEY:-changeme}
      REPORTS_RENDERER_LOG_LEVEL: INFO
      REPORTS_RENDERER_LOG_FORMAT: json
      REPORTS_RENDERER_TLS_CERT: /opt/taranac/certs/renderer/server.crt
      REPORTS_RENDERER_TLS_KEY: /opt/taranac/certs/renderer/server.key
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - taranac_certs:/opt/taranac/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "10" }

  # ── winbind — the Active Directory machine account (MS-CHAPv2) ──────
  # Its own container because NAC needs domain authentication too: inside radius,
  # rebuilding that daemon would take NAC's domain auth with it, and membership
  # state shared by both would live in a volume owned by one consumer.
  #
  # Inert until a domain is configured — with no generated smb.conf it starts,
  # reports "not joined" and does nothing, so it is safe on every installation.
  winbind:
    container_name: taranac-winbind
    sysctls: *ipv4-only
    networks:
      default:
        ipv4_address: 10.255.255.231
    image: ${IMAGE_PREFIX}/winbind:${TARANAC_VERSION}
    environment:
      LOG_LEVEL: "INFO"
      KRB5_CONFIG: "/etc/samba/krb5.conf"
    # DNS for the sidecar. Left EMPTY on purpose: an empty value makes Compose
    # drop the key entirely, and the container then resolves exactly like every
    # other service in the stack — through Docker's embedded resolver, which
    # forwards to the host's real upstreams. That is what makes SRV discovery
    # (_ldap._tcp.dc._msdcs.<domain>) work, and it needs no configuration at all
    # on a host that can already resolve the domain.
    #
    # This used to default to 127.0.0.11 — the embedded resolver's own address —
    # on the belief that it does not forward SRV. It does (measured). Naming it
    # explicitly is what breaks resolution: the embedded server is then told to
    # forward to itself, so every external lookup dies and the join fails with
    # "failed to find DC for domain" on a host whose DNS was perfectly fine.
    #
    # Set WINBIND_DNS only when the HOST itself cannot resolve the AD zone; then
    # point it at a resolver that can (usually a domain controller). Note the
    # resolver limit of three servers — listing every DC is not the way to get
    # redundancy; SRV discovery already provides it.
    dns: ${WINBIND_DNS:-}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - winbind_config:/etc/samba
      # secrets.tdb — the MACHINE ACCOUNT PASSWORD. Node-local, persistent, and
      # deliberately NOT part of any backup: a stale one is WORSE than none (it
      # produces a broken trust that reads as a mysterious authentication
      # failure, instead of an honest "not joined"). Samba rotates it weekly by
      # itself, so a backup older than a week could never be used anyway.
      - winbind_state:/var/lib/samba
      - winbind_socket:/var/lib/samba/winbindd_privileged
      - winbind_run:/var/run/samba/winbindd
      - winbind_runtime:/var/lib/taranac-winbind
      - winbind_logs:/var/log/taranac
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "100m", max-file: "10" }

  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    container_name: taranac-db
    sysctls: *ipv4-only
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    # Replication-ready baseline (HA, docs/ops/ha.md / D6). Inert on a
    # single node; baking it in now makes converting to HA a config overlay, not a
    # re-init. The repl-ready conf below applies on every start; --data-checksums
    # and the replicator role apply ONLY on a fresh data dir (initdb) — an existing
    # install needs offline pg_checksums + a manual replicator role before going HA.
    #
    # ── The guard in front of it, and why it lives HERE ───────────────────────
    # On an HA node the database is Patroni's, via docker-compose.ha.yml. Starting
    # THIS service without that overlay puts an ordinary, writable Postgres on
    # Patroni's data directory — a second write history, created by one command.
    #
    # ./taranac and install.sh both refuse that, and both are bypassed the moment
    # someone types `docker compose -f docker-compose.yml up -d` — which is a
    # reasonable thing to type, and is exactly how it happened in the field. A
    # guard that only exists in the wrappers guards the wrappers, not the data.
    # So the refusal is in the file that would do the damage.
    #
    # It costs the standalone path nothing: the overlay replaces `command` with
    # `[]` (see docker-compose.ha.yml), so under HA this wrapper is not even
    # present, and on a standalone node the exec below reaches the image's own
    # entrypoint with the identical arguments — same initdb hooks, same
    # --data-checksums, same replicator role.
    command:
      - "sh"
      - "-c"
      - |
        if [ "$${TARANAC_HA:-}" = "1" ]; then
          echo "taranac-db: REFUSING to start — this node is part of an HA cluster (TARANAC_HA=1)," >&2
          echo "  and this is the BASE compose file, without the Patroni overlay." >&2
          echo "  Starting here would put a second, WRITABLE Postgres on Patroni's data directory:" >&2
          echo "  two write histories on one data set, which no failover can reconcile." >&2
          echo "" >&2
          echo "  Start the node through the wrapper, which merges the overlay itself:" >&2
          echo "      ./taranac up -d" >&2
          echo "" >&2
          echo "  If this node is genuinely no longer part of a cluster, shrink it first:" >&2
          echo "      ./ha-deconvert.sh" >&2
          exit 1
        fi
        exec /usr/local/bin/docker-entrypoint.sh postgres \
          -c wal_level=replica \
          -c max_wal_senders=10 \
          -c max_replication_slots=10 \
          -c hot_standby=on \
          -c wal_log_hints=on \
          -c wal_keep_size=512MB \
          -c max_slot_wal_keep_size=2GB \
          -c max_connections=300
        # max_connections: Postgres' own default is 100, which the product had
        # never counted against. Counted on a 3-node HA cluster — where every
        # node's writes route to the ONE primary — the demand on that primary is
        # 3×30 (api engines) + 3×16 (radius/nac) + 3×16 (tacacs write pools) +
        # 3×2 (mfa) + 45 (this node's own local reads and Patroni) + 4
        # (replication) + 10 (tooling and the superuser reserve) = 251. 300
        # covers that with headroom. Note what this is NOT: the ceiling was never
        # what broke — daemons hoarding idle connections was, and that is fixed
        # in the pools themselves. This is the guard rail. On an HA node Patroni
        # owns the value instead (postgres-ha/patroni.yml.tmpl); raising it on a
        # LIVE cluster is an ordered procedure, see ha.md.
        # max_slot_wal_keep_size is a disk backstop for replication slots — inert
        # without slots, LOAD-BEARING under Patroni/HA (which gives every replica a
        # slot). It caps the WAL a single slot may pin, so an orphaned or
        # decommissioned slot can never fill the disk: past this size Postgres
        # invalidates the slot (wal_status='lost') instead of hoarding WAL. Generous
        # against the §9 write volume (~10-20/s) so a legitimate replica never trips
        # it; the orphan-slot reaper (ha.md §10.2) reclaims any invalidated slot.
    environment:
      POSTGRES_DB: taranac
      POSTGRES_USER: taranac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # The replicator role's password (used by a joining replica's pg_basebackup).
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-}
      # Read by the guard in `command` above — the marker ha-convert/ha-join write
      # on conversion. Absent or empty on a standalone node, which is the whole
      # population this service is for.
      TARANAC_HA: ${TARANAC_HA:-}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # First-init only: 05 = replicator role + pg_hba (HA baseline); 10 = the
      # taranac_mfa database. Both no-ops on an already-initialised data dir.
      - ./postgres-initdb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taranac -d taranac"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  taranac_edge_tls:
  app_logs: {}
  aaa_logs: {}
  tacacs_logs: {}
  radius_logs: {}
  nac_logs: {}
  pg_data: {}
  mfa_data: {}
  master_key: {}
  tacacs_config: {}
  radius_config: {}
  nac_config: {}
  captive_portal_config: {}
  portal_instance_data: {}
  taranac_certs: {}
  vendor_dictionaries: {}
  winbind_config: {}
  # The machine account. Node-local and deliberately outside every backup.
  winbind_state: {}
  winbind_socket: {}
  winbind_run: {}
  winbind_runtime: {}
  winbind_logs: {}
  backups: {}

networks:
  default:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        # Pinned so Docker never picks a range a LAN uses. Two halves: Docker hands
        # out addresses only from ip_range, the /28 this network was until 1.3.3 —
        # the api, Postgres/Patroni, etcd, mfa and every HA probe live there, so the
        # one host-firewall rule HA needs (`from 10.255.255.240/28 … port 2379,8008`,
        # HA.md) still names them all. What never dials this node's own address has
        # a fixed address in the lower half (ipv4_address above): the /28 alone held
        # 13 containers, the full stack is 13 on an HA node, and a probe that cannot
        # get an address there stops add-witness, add-node and diagnose.
        - subnet: 10.255.255.224/27
          ip_range: 10.255.255.240/28
          gateway: 10.255.255.225
        # IPv6 for the client-facing services only (x-ipv4-only above): a ULA
        # with a random Global ID (RFC 4193) — not fd00::/64, which home routers
        # hand out. Written canonically: the updater compares it with what Docker
        # reports and recreates the network only when they differ.
        - subnet: fd64:1fbc:c16e::/64
